{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block guest_content %}
<div class="card w-full max-w-sm">
  <div class="mb-6 text-center text-2xl font-semibold text-emerald-700">🥝 Kiwi</div>
  {% if form.errors %}
  <p class="mb-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
    Email ou mot de passe incorrect.
  </p>
  {% endif %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="mb-1 block text-sm font-medium text-stone-700">Email</label>
      <input type="email" name="username" autofocus required class="form-input" value="{{ form.username.value|default:'' }}">
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-stone-700">Mot de passe</label>
      <input type="password" name="password" required class="form-input">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn-primary w-full">Se connecter</button>
  </form>
  <p class="mt-4 text-center text-sm text-stone-600">
    <a href="{% url 'accounts:magic_link_request' %}" class="text-emerald-700 underline">Se connecter sans mot de passe (lien par email)</a>
  </p>
  <p class="mt-2 text-center text-sm text-stone-600">
    Pas encore de compte ? <a href="{% url 'accounts:signup' %}" class="text-emerald-700 underline">Inscrivez-vous</a>
  </p>
</div>
{% endblock %}
