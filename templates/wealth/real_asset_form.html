{% extends "base.html" %}
{% block title %}Nouvel actif{% endblock %}
{% block page_title %}Nouvel actif réel{% endblock %}
{% block content %}
<div class="card max-w-lg">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label class="mb-1 block text-sm font-medium text-stone-700">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn-primary w-full">Ajouter</button>
  </form>
</div>
{% endblock %}
